services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: task_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskdb
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Redis for BullMQ
  redis:
    image: redis:alpine
    container_name: task_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 3. Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: task_backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/taskdb
      - JWT_ACCESS_SECRET=super_secret_access_key_1234567890_abcd
      - JWT_REFRESH_SECRET=super_secret_refresh_key_1234567890_abcd
      - ACCESS_TOKEN_EXPIRES_IN=15m
      - REFRESH_TOKEN_EXPIRES_IN=7d
      - BCRYPT_SALT_ROUNDS=10
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend/uploads:/app/uploads

volumes:
  postgres_data:
  redis_data: